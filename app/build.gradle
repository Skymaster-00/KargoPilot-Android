plugins { id 'com.android.application' }

android {
    buildFeatures { buildConfig true }
    namespace 'com.kargopilot.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.kargopilot.app'
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName '1.1.1'
    }
    def localSigning = new Properties()
    def signingPropertiesFile = rootProject.file('.signing/signing.properties')
    if (signingPropertiesFile.exists()) signingPropertiesFile.withInputStream { localSigning.load(it) }
    def signingPath = System.getenv('KP_STORE_FILE') ?: localSigning.getProperty('storeFile')
    if (signingPath) {
        signingConfigs {
            release {
                storeFile rootProject.file(signingPath)
                storePassword System.getenv('KP_STORE_PASSWORD') ?: localSigning.getProperty('storePassword')
                keyAlias 'kargopilot'
                keyPassword System.getenv('KP_STORE_PASSWORD') ?: localSigning.getProperty('storePassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingPath) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
