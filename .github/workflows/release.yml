name: Signed Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify application workflows and responsive layouts
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-qa
          path: artifacts/qa/*.png
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD"
          mkdir -p .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/release.jks
      - name: Build and lint signed APK
        env:
          KP_STORE_FILE: .signing/release.jks
          KP_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:lintRelease --console=plain
      - name: Verify APK signature and prepare download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/KargoPilot.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/KargoPilot.apk
          cd dist
          sha256sum KargoPilot.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KargoPilot-APK
          path: dist/*
      - name: Publish versioned APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/KargoPilot.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/KargoPilot.apk dist/SHA256SUMS.txt --title "KargoPilot $VERSION" --notes-file RELEASE_NOTES.md --latest
          fi
